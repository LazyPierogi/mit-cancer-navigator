                  - generic [ref=e8003]:
                    - heading "Abstract" [level=4] [ref=e8004]
                    - paragraph [ref=e8005]: "BACKGROUND: Acquired resistance is defined as disease progression following an initial response to immune checkpoint inhibitors (ICI). The impact of adding platinum-based chemotherapy (PCT) or anti-CTLA-4 agents to PD-(L)-1 inhibitors on acquired resistance is currently unknown. METHODS: Systematic research by January 31, 2025 identified randomized clinical trials (RCTs) evaluating first-line ICI as monotherapy (mono-ICI) or in combination with PCT (mono-ICI + PCT), CTLA-4 inhibitors (combo-ICI), or both (combo-ICI + PCT) in metastatic non-small-cell lung cancer (NSCLC). RCTs reporting duration of response (DoR) data were eligible. Acquired resistance rates at 6 and 12 months were estimated from DoR curves. Aggregate data based on type of regimens were reported with risk ratio (RR) and pooled by random effect model. Primary and secondary endpoints were respectively the indirect comparison of acquired resistance risk between PCT-containing versus PCT-free regimens and between anti-CTLA-4 containing versus anti-CTLA-4 free regimens, respectively. Time-to-event outcomes were retrieved from Kaplan-Meier (KM) curves using individual patient data (IPD) and compared by log rank tests. This study was registered to the PROSPERO online platform (CRD42025639320). FINDINGS: Nineteen RCTs were included. 6- and 12-months acquired resistance rates were 16.5%-34.1% (mono-ICI), 26.4%-47.8% (mono-ICI + PCT), 19.0%-33.0% (combo-ICI), and 28.4%-47.1% (combo-ICI + PCT). A higher risk of acquired resistance was suggested from indirect comparisons of mono-ICI + PCT versus mono-ICI (12-months RR: 1.46, 95% CI 1.23-1.75) and of combo-ICI + PCT versus combo-ICI (12 months RR: 1.36, 95% CI 1.06-1.73). Using the reconstructed patient-level data, median DoR was 5-7 months significantly shorter with PCT-containing compared to PCT-free regimens. The addition of anti-CTLA-4 agents did not impact on acquired resistance. INTERPRETATION: Although insufficient RCTs reported acquired resistance rates stratified by specific factors influencing DoR (i.e., PD-L1, TMB) for such analyses to be included in this report, the increased acquired resistance risk observed with PCT-containing regimens highlights the potential value of tailoring first-line treatment strategies in NSCLC on the basis of individual risk of resistance to ICI. FUNDING: This research did not receive any specific grant from funding agencies."
