                    - heading "Abstract" [level=4] [ref=e8217]
                    - paragraph [ref=e8218]: "Introduction: In the absence of head-to-head trials comparing immunotherapies for advanced nonsquamous non-small-cell lung cancer (NsqNSCLC), a network meta-analysis (NMA) was conducted to compare the relative efficacy of these treatments. Materials & methods: A systematic literature review of randomized controlled trials evaluating first-line-to-progression and second-line treatments for advanced NsqNSCLC informed Bayesian NMAs for overall survival (OS) and progression-free survival (PFS) end points. Results: Among first-line-to-progression treatments, pembrolizumab + pemetrexed + platinum showed the greatest OS benefit versus other regimens and a PFS benefit versus all but three regimens. Among second-line treatments, an OS benefit was seen for atezolizumab, nivolumab and pembrolizumab versus docetaxel. Conclusion: Pembrolizumab + pemetrexed + platinum showed the maximum OS benefit in the first-line setting. In the second-line setting, anti-PD-1/anti-PD-L1 monotherapies were better than docetaxel."
