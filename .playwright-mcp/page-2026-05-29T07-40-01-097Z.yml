                  - generic [ref=e8926]:
                    - heading "Abstract" [level=4] [ref=e8927]
                    - paragraph [ref=e8928]: "BACKGROUND: Nivolumab has shown improved survival in the treatment of advanced non-small-cell lung cancer (NSCLC) previously treated with chemotherapy. We assessed the safety and activity of combination nivolumab plus ipilimumab as first-line therapy for NSCLC. METHODS: The open-label, phase 1, multicohort study (CheckMate 012) cohorts reported here were enrolled at eight US academic centres. Eligible patients were aged 18 years or older with histologically or cytologically confirmed recurrent stage IIIb or stage IV, chemotherapy-naive NSCLC. Patients were randomly assigned (1:1:1) by an interactive voice response system to receive nivolumab 1 mg/kg every 2 weeks plus ipilimumab 1 mg/kg every 6 weeks, nivolumab 3 mg/kg every 2 weeks plus ipilimumab 1 mg/kg every 12 weeks, or nivolumab 3 mg/kg every 2 weeks plus ipilimumab 1 mg/kg every 6 weeks until disease progression, unacceptable toxicities, or withdrawal of consent. Data from the latter two cohorts, which were considered potentially suitable for further clinical development, are presented in this report; data from the other cohort (as well as several earlier cohorts) are described in the appendix. The primary outcome was safety and tolerability, assessed in all treated patients. This ongoing study is registered with ClinicalTrials.gov, number NCT01454102. FINDINGS: Between May 15, 2014, and March 25, 2015, 78 patients were randomly assigned to receive nivolumab every 2 weeks plus ipilimumab every 12 weeks (n=38) or nivolumab every 2 weeks plus ipilimumab every 6 weeks (n=40). One patient in the ipilimumab every-6-weeks cohort was excluded before treatment; therefore 77 patients actually received treatment (38 in the ipilimumab every-12-weeks cohort; 39 in the ipilimumab every-6-weeks cohort). At data cut-off on Jan 7, 2016, 29 (76%) patients in the ipilimumab every-12-weeks cohort and 32 (82%) in the ipilimumab every-6-weeks cohort had discontinued treatment. Grade 3-4 treatment-related adverse events occurred in 14 (37%) patients in the ipilimumab every-12-weeks cohort and 13 (33%) patients in the every-6-weeks cohort; the most commonly reported grade 3 or 4 treatment-related adverse events were increased lipase (three [8%] and no patients), pneumonitis (two [5%] and one [3%] patients), adrenal insufficiency (one [3%] and two [5%] patients), and colitis (one [3%] and two [5%] patients). Treatment-related serious adverse events were reported in 12 (32%) patients in the ipilimumab every-12-weeks cohort and 11 (28%) patients in the every-6-weeks cohort. Treatment-related adverse events (any grade) prompted treatment discontinuation in four (11%) patients in the every-12-weeks cohort and five (13%) patients in the every-6-weeks cohort. No treatment-related deaths occurred. Confirmed objective responses were achieved in 18 (47% [95% CI 31-64]) patients in the ipilimumab every-12-weeks cohort and 15 (38% [95% CI 23-55]) patients in the ipilimumab every-6-weeks cohort; median duration of response was not reached in either cohort, with median follow-up times of 12·8 months (IQR 9·3-15·5) in the ipilimumab every-12-weeks cohort and 11·8 months (6·7-15·9) in the ipilimumab every-6-weeks cohort. In patients with PD-L1 of 1% or greater, confirmed objective responses were achieved in 12 (57%) of 21 patients in the ipilimumab every-12-weeks cohort and 13 (57%) of 23 patients in the ipilimumab every-6-weeks cohort. INTERPRETATION: In NSCLC, first-line nivolumab plus ipilimumab had a tolerable safety profile and showed encouraging clinical activity characterised by a high response rate and durable response. To our knowledge, the results of this study are the first suggestion of improved benefit compared with anti-PD-1 monotherapy in patients with NSCLC, supporting further assessment of this combination in a phase 3 study. FUNDING: Bristol-Myers Squibb."
