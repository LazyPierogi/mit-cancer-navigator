                    - heading "Abstract" [level=4] [ref=e7010]
                    - paragraph [ref=e7011]: "INTRODUCTION: This systematic review and network meta-analysis(NMA) was designed to compare the long-term outcomes of pembrolizumab monotherapy and pembrolizumab plus chemotherapy as first-line therapy for metastatic non-small-cell lung cancer(NSCLC). MATERIALS AND METHODS: Four databases(Medline, Embase, Web of Science and CENTRAL were searched published from establishment of database to August 17, 2023, for articles studying pembrolizumab monotherapy or pembrolizumab plus chemotherapy for non-small cell lung cancer (NSCLC). Network meta-analyses of progression-free survival(PFS), overall survival(OS), objective response rate(ORR), treatment-related adverse events(trAEs) and immune-related adverse events(irAEs) were performed. RESULTS: A total of five studies were considered for NMA. This NMA includes a cohort of 2878 patients diagnosed with advanced NSCLC. Among them, 791 patients received pembrolizumab monotherapy, 1337 patients received chemotherapy, and 748 patients received pembrolizumab plus chemotherapy. The IPDformKM software was utilized to reconstruct Kaplan-Meier curves for OS and PFS, offering a lucid and intuitive depiction of oncological outcomes. For patients who have high levels of programmed death-ligand 1(PD-L1) expression (≥50%), pembrolizumab plus chemotherapy was more effective than using pembrolizumab alone as first-line therapy in terms of PFS (median survival time: 10.41 months versus 7.41 months, HR: 0.81, 95%CI 0.67 to 0.97, P=0.02) and ORR (RR:1.74, 95% CI: 1.25-2.43). Nevertheless, there was no statistically significant difference observed between the two groups in terms of OS (median survival time: 22.54 months versus 22.62 months, HR: 0.89, 95%CI 0.73 to 1.08, P=0.24). Furthermore, pembrolizumab plus chemotherapy provided a more advantageous long-term survival advantage in terms of OS (median survival time: 20.88 months versus 13.60 months, HR: 0.77, 95%CI: 0.62 to 0.95, P=0.015) compared to pembrolizumab monotherapy in patients with low PD-L1 expression levels (1% to 49%). With regards to safety, there was no statistically significant disparity between the two groups in relation to any irAEs (RD=0.02, 95% CI: -0.12 to 0.16) or Grade≥ 3 irAEs (RD=0.01, 95% CI: -0.10 to 0.12). Nevertheless, pembrolizumab plus chemotherapy exhibited a greater likelihood of encountering any trAEs (RD=0.23, 95% CI: 0.17 to 0.30) and Grade≥ 3 trAEs (RD=0.28, 95% CI: 0.21 to 0.35) in comparison to pembrolizumab monotherapy. CONCLUSIONS: The present network meta-analysis reported comparative long-term outcomes of pembrolizumab plus chemotherapy versus pembrolizumab monotherapy as first-line therapy for metastatic non-small-cell lung cancer. Pembrolizumab plus chemotherapy led to improved PFS and ORR in patients with advanced NSCLC who had a PD-L1 expression level of 50% or above. However, there was no noticeable benefit in terms of OS when pembrolizumab was paired with chemotherapy compared to utilizing pembrolizumab alone. In addition, pembrolizumab plus chemotherapy offered a greater long-term survival benefit in terms of OS when compared to utilizing pembrolizumab alone in patients with PD-L1 expression levels ranging from 1% to 49%. Furthermore, the increased effectiveness of pembrolizumab plus chemotherapy was accompanied by an increase in adverse side effects. SYSTEMATIC REVIEW REGISTRATION: https://www.crd.york.ac.uk/prospero/, identifier CRD42024501740."
