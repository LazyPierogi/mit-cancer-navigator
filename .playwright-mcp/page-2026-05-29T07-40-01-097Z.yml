                  - generic [ref=e9981]:
                    - heading "Abstract" [level=4] [ref=e9982]
                    - paragraph [ref=e9983]: "BACKGROUND: It is now widely accepted that radiotherapy (RT) can provoke a systemic immune response, which gives a strong rationale for the combination of RT and immune checkpoint inhibitors (ICIs). However, RT is a double-edged sword that not only enhances systemic antitumor immune response, but also promotes immunosuppression to some extent. Nevertheless, many aspects regarding the efficacy and safety of this combination therapy remain unknown. Therefore, a systematic review and meta-analysis was performed in order to assess the safety and efficacy of RT/chemoradiotherapy (CRT) and ICI combination therapy for non-small cell lung cancer (NSCLC) patients. METHODS: PubMed and several other databases were searched (according to specific criteria) to find relevant studies published prior to the 28(th) of February 2022. RESULTS: 3,652 articles were identified for screening and 25 trials containing 1,645 NSCLC patients were identified. For stage II-III NSCLC, the one- and two-year overall survival (OS) was 83.25% (95% confidence interval (CI): 79.42%-86.75%) and 66.16% (95% CI: 62.3%-69.92%), respectively. For stage IV NSCLC, the one- and two-year OS was 50% and 25%. In our study, the pooled rate of grade 3-5 adverse events (AEs) and grade 5 AEs was 30.18% (95% CI: 10.04%-50.33%, I(2): 96.7%) and 2.03% (95% CI: 0.03%-4.04%, I(2): 36.8%), respectively. Fatigue (50.97%), dyspnea (46.06%), dysphagia (10%-82.5%), leucopenia (47.6%), anaemia (5%-47.6%), cough (40.09%), esophagitis (38.51%), fever (32.5%-38.1%), neutropenia (12.5%-38.1%), alopecia (35%), nausea (30.51%) and pneumonitis (28.53%) were the most common adverse events for the combined treatment. The incidence of cardiotoxicity (0%-5.00%) was low, but it was associated with a high mortality rate (0%-2.56%). Furthermore, the incidence of pneumonitis was 28.53% (95% CI: 19.22%-38.88%, I(2): 92.00%), grade ≥ 3 pneumonitis was 5.82% (95% CI: 3.75%-8.32%, I(2): 57.90%) and grade 5 was 0%-4.76%. CONCLUSION: This study suggests that the addition of ICIs to RT/CRT for NSCLC patients may be both safe and feasible. We also summarize details of different RT combinations with ICIs to treat NSCLC. These findings may help guide the design of future trials, the testing of concurrent or sequential combinations for ICIs and RT/CRT could be particularly useful to guide the treatment of NSCLC patients."
