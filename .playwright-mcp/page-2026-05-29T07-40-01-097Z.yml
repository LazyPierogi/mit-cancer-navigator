                  - generic [ref=e9210]:
                    - heading "Abstract" [level=4] [ref=e9211]
                    - paragraph [ref=e9212]: "BACKGROUND: Cixutumumab is a fully human IgG1 monoclonal antibody to the insulin-like growth factor type I receptor that can potentially reverse resistance and enhance the efficacy of chemotherapy. METHODS: Bevacizumab-eligible patients with stage IV or recurrent non-squamous, non-small-cell lung cancer and good performance status were randomized to receive standard doses of paclitaxel, carboplatin, and bevacizumab to a maximum of six cycles followed by bevacizumab maintenance (CPB) until progression (arm A) or CPB plus cixutumumab 6 mg/kg i.v. weekly (arm B). RESULTS: Of 175 patients randomized, 153 were eligible and treated (78 in arm A; 75 in arm B). The median progression-free survival was 5.8 months (95% CI 5.4-7.1) in arm A versus 7 months (95% CI 5.7-7.6) in arm B (P = 0.33); hazard ratio 0.92 (95% CI 0.65-1.31). Objective response was 46.2% versus 58.7% in arm A versus arm B (P = 0.15). The median overall survival was 16.2 months in arm A versus 16.1 months in arm B (P = 0.95). Grade 3/4 neutropenia and febrile neutropenia, thrombocytopenia, fatigue, and hyperglycemia were increased with cixutumumab. CONCLUSIONS: The addition of cixutumumab to CPB increased toxicity without improving efficacy and is not recommended for further development in non-small-cell lung cancer. Both treatment groups had longer OS than historical controls which may be attributed to several factors, and emphasizes the value of a comparator arm in phase II trials. CLINICALTRIALS.GOV IDENTIFIER: NCT00955305."
