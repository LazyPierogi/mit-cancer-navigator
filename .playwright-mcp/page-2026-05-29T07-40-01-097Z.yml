                  - generic [ref=e11085]:
                    - heading "Abstract" [level=4] [ref=e11086]
                    - paragraph [ref=e11087]: "BACKGROUND: The abscopal effect is a rare phenomenon whereby local radiation induces a proposed immune-mediated anti-tumor effect at distant sites. Given the growing use of immunotherapies and systemic immune checkpoint inhibitors in neuro-oncologic practice, we aimed to review prior studies pertaining to this phenomenon in the context of tumor shrinkage both within the central nervous system as well as distant disease sites. METHODS: A systematic review in accordance with the PRISMA guidelines was conducted to identify all studies which assessed the abscopal effect in patients with treated metastatic cancer to the brain and/or spine. Articles were included if they reported the abscopal effect in patients (case studies) or if the abscopal effect was explicitly analyzed in case series with cohorts of patients with metastatic brain or spine tumors. Laboratory investigations and clinical trials investigating new therapies were excluded. RESULTS: Twenty reports met inclusion criteria [16 case reports, 4 case series (n = 160), total n = 174]. Case reports of the abscopal effect were in relation to the following cancers: melanoma (6 patients), breast cancer (3), lung adenocarcinoma (2), non-small-cell lung cancer (2), hepatocellular carcinoma (1), and renal cell carcinoma (1). Eleven patients had irradiation to the brain and 2 to the spine. Patients undergoing whole brain radiotherapy (6) had an average dose of 33.6 Gy over 8-15 fractions, and those undergoing stereotactic radiosurgery (5) had an average dose of 21.5 Gy over 1-5 fractions. One patient had radiation to the body and an intracranial abscopal effect was observed. Most common sites of extracranial tumor reduction were lung and lymph nodes. Ten case studies (57%) showed complete resolution of extra-CNS tumor burden. Median progression-free survival was 13 months following radiation. Four papers investigated incidence of abscopal effects in patients with metastatic melanoma to the brain who received immune checkpoint inhibitor therapy (n = 160); two papers found an abscopal effect in 35% and 52% of patients (n = 16, 21 respectively), and two papers found no evidence of abscopal effects (n = 61, 62). CONCLUSIONS: Abscopal effects can occur following radiotherapy in patients with brain or spine metastases and is thought to be a result of increased anti-tumor immunity. The potential for immune checkpoint inhibitor therapy to be used in combination with radiotherapy to induce an abscopal effect is an area of active investigation."
