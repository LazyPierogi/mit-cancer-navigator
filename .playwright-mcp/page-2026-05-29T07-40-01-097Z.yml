                  - generic [ref=e10464]:
                    - heading "Abstract" [level=4] [ref=e10465]
                    - paragraph [ref=e10466]: "BACKGROUND: The development and regulatory approval of anti-programmed death (ligand) 1 (anti-PD-(L)1) agents, based on positive clinical trial results, has dramatically changed clinical practice and treatment paths in oncology. However, the effectiveness of anti-PD-(L)1 therapy in real-world settings is not well understood. Therefore, it is important to summarize real-world evidence on the overall survival (OS) of patients with specific tumor types prior to and following the regulatory approval of anti-PD-(L)1 therapy. METHODS: A systematic literature review including observational studies worldwide reporting the OS of patients receiving conventional first-line pharmacological therapy for advanced/metastatic non-small cell lung cancer (NSCLC), renal cell carcinoma (RCC), or melanoma in the anti-PD-(L)1 pre-approval era and similar patients receiving first-line anti-PD-(L)1 therapy in the post-approval era was conducted. For each tumor type, studies were selected from a pre-approval era, defined as a period beginning 5 years before the first approval of an anti-PD-(L)1 agent and ending the year before its approval for first-line therapy, and a post-approval era, defined as a period beginning the year that an anti-PD-(L)1 agent was approved for first-line therapy and ending in 2023. Relevant studies were identified through MEDLINE and Embase searches. Study selection, data extraction, and quality assessment were conducted by two independent reviewers. Median OS (mOS) was summarized within each tumor type and descriptively compared across the pre- and post-approval eras. RESULTS: A total of 86, 44, and 35 studies evaluating first-line treatments for advanced/metastatic NSCLC, RCC, and melanoma, respectively, were included. Post-approval mOS in patients treated with anti-PD-(L)1 therapy tended to be numerically longer than pre-approval mOS in patients treated with conventional therapy within certain patient and treatment categories. For example, pre-approval mOS ranged from 6.9 to 18.4 months (n=18 treatment groups), and post-approval mOS ranged from 10.6 to 46.2 months in NSCLC patients with PD-L1 tumor expression ≥50% who received anti-PD-(L)1 monotherapy (n=33; with mOS not reached for n=3). In RCC patients classified as high-risk, pre-approval mOS ranged from 2 to 10.3 months (n=7), and post-approval mOS ranged from 7.8 to 24.3 months (n=4). Also, in melanoma patients with any BRAF mutation, pre-approval mOS was 14.2 months (n=1), and post-approval mOS ranged from 15.9 to 51.2 months (n=6; with mOS not reached for n=3). CONCLUSION: A survival benefit in real-world practice was observed for patients with advanced/metastatic NSCLC, RCC, or melanoma receiving first-line anti-PD-(L)1 therapy after its regulatory approval when compared with patients treated with conventional care before anti-PD-(L)1 therapy approval. This supports the use of anti-PD-(L)1 therapy as a standard of care in many countries."
