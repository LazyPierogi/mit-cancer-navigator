                  - generic [ref=e9774]:
                    - heading "Abstract" [level=4] [ref=e9775]
                    - paragraph [ref=e9776]: "Although many genome-wide association studies (GWAS) have confirmed the negative associations between rs401681[T] / rs402710[T] in the Cleft lip and cleft palate transmembrane protein 1 (CLPTM1L) region and lung cancer (LC) susceptibility in Caucasian and Asian populations, some other studies haven't found these negative associations. The purpose of this study is to clarify the associations between them and LC, as well as the differences in these associations between patients of different ethnicities (Caucasians and Asians), LC subtypes and smoking status. Relevant literatures published before July 7, 2023 in PubMed, EMbase, Web of Science, MEDLINE were searched through the Internet. Statistical analysis of data was performed in Revman 5.3, including drawing forest plots, funnel plots and so on. Sensitivity and publication bias were performed in Stata 14.0. TSA software was performed for the trial sequential analysis (TSA) tests to assess the stability of the results. Registration number: CRD42023407890. A total of 41 literatures (containing 44 studies: 16 studies in Caucasians and 28 studies in Asians) were included in this meta-analysis, including 126476 LC patients and 191648 healthy controls. The results showed that the T allele variants of rs401681 and rs402710 were negatively associated with the risk of LC (rs401681[T]: [OR] = 0.87, 95% CI [0.86, 0.88]; rs402710[T]: [OR] = 0.88, 95% CI [0.86, 0.89]), and the negative associations were stronger in Caucasians than in Asians (Subgroup differences: I(2) > 50%). In LC subtypes, the rs401681[T] was negatively associated with the risk of Non-small-cell lung carcinoma (NSCLC), Lung adenocarcinoma (LUAD) and Lung squamous cell carcinoma (LUSC) (P < 0.05), and these negative associations were stronger in Caucasians than in Asians (Subgroup differences: I(2) > 50%). The rs402710[T] was negatively associated with the risk of NSCLC, LUAD and LUSC (P < 0.05), and these negative associations in Caucasians were the same as in Asians (Subgroup differences: I(2) < 50%). The rs401681[T] was negatively associated with the risk of LC in both smokers and non-smokers (P < 0.05), and the negative association for smokers equals to that of non-smokers (Subgroup differences: P = 0.25, I(2) = 24.2%). In LC subtypes, the rs401681[T] was negatively associated with the risks of NSCLC and LUAD in both Caucasian smokers and Asian non-smokers (P < 0.05). The rs402710[T] was negatively associated with the risk of LC in both smokers and non-smokers (P < 0.05), and there was no difference in the strength of this negative risk association between them in Caucasians (Subgroup differences: I(2) = 0%). In Asians, this negative association was found to be predominantly among smokers ([OR] = 0.80, 95%CI [0.65, 0.99]). In LC subtypes, the rs402710[T]was negatively associated with the risk of NSCLC in non-smokers, and this negative association was found to be predominantly among non-smokers in Asians ([OR] = 0.75, 95%CI [0.60, 0.94]). The T allele variants of rs401681 and rs402710 are both negatively associated with the risk of developing LC, NSCLC (LUAD, LUSC) in the Caucasian and Asian populations, and the negative associations with the risk of LC are higher in Caucasians. Smoking is an important risk factor for inducing the rs401681 and rs402710 variants and causes LC development in both populations. Other factors like non-smoking are mainly responsible for inducing the development of NSCLC in Asians, and is concentrated in LUAD among Asian non-smoking women."
