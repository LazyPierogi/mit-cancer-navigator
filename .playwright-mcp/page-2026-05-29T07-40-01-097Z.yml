                  - generic [ref=e11223]:
                    - heading "Abstract" [level=4] [ref=e11224]
                    - paragraph [ref=e11225]: "INTRODUCTION: Treatment of advanced stage non-small cell lung cancer (NSCLC) has changed dramatically due to immunotherapy. However, patients without Programmed Death-Ligand 1 (PD-L1) protein expression often benefit less from immunotherapy. This trial is designed to test if stereotactic body radiation therapy (SBRT) to a single tumor site can significantly enhance the outcome of patients with advanced stage PD-L1(-) NSCLC when added to systemic therapy including immunotherapy. MATERIALS AND METHODS: Alliance A082002 is based on subgroup analysis from the randomized phase II PEMBRO-RT trial., PEMBRO-RT compared pembrolizumab alone or with SBRT and revealed improved progression-free and overall survival (PFS and OS, respectively) in PD-L1(-) patients when adding SBRT (8 Gy x 3 fractions). In A082002, patients without PD-L1 expression will be randomized to SBRT (8 Gy x3) plus systemic therapy vs. systemic therapy alone. The primary endpoint of the phase II portion of the trial is PFS and will require 100 patients. The primary endpoint of the phase III portion of the trial is OS and will require an additional 284 patients. This trial will clarify whether adding SBRT to systemic therapy can improve PFS and OS in a larger multi-institutional cohort. Several systemic treatment options are allowed including either immunotherapy alone or chemo-immunotherapy. CONCLUSIONS: This phase II/III Alliance trial A082002 will test whether the addition of SBRT to a single tumor site will enhance the anti-tumor activity of systemic immunotherapy or chemo-immunotherapy in patients with stage IV PD-L1(-) NSCLC. It is now open in the National Clinical Trials Network (NCTN)."
