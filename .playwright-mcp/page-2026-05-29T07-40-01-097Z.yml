                  - generic [ref=e11775]:
                    - heading "Abstract" [level=4] [ref=e11776]
                    - paragraph [ref=e11777]: "BACKGROUND: The advance directive represents patients' health care choices and fosters patients' autonomy. Nevertheless, understanding patients' wishes based on the information provided in advance directives remains a challenge for health care providers. Based on the ethical premises of positive obligation to autonomy, an advanced directive that is disease-centred and details potential problems and complications of the disease should help health care providers correctly understand patients' wishes. To test this hypothesis, a pilot-study was conducted to investigate whether physicians could make the correct end-of-life decision for their patients when patients used a disease-centred advance directive compared to a common advance directive. MATERIAL AND METHODS: A randomised, controlled, prospective pilot study was designed that included patients with non-small cell lung cancer (NSCLC) stage VI from the Department of Haematology and Medical Oncology, University Medical Centre, Goettingen. Patients were randomised into intervention and control groups. The control group received a common advance directive, and the intervention group received a disease-centred advance directive. Both groups filled out their advance directives and returned them. Subsequently, patients were asked to complete nine medical scenarios with different treatment decisions. For each scenario the patients had to decide whether they wanted to receive treatment on a 5-point Likert scale. Four physicians were given the same scenarios and asked to decide on the treatment according to the patients' wishes as stated in their advance directives. The answers by patients and physicians were then compared to establish whether physicians had made the correct assumptions. RESULTS: Recruitment was stopped prior to reaching anticipated sample target. 15 patients with stage IV NSCLC completed the study, 9 patients were randomised into the control group and 6 patients in the intervention group. A total of 135 decisions were evaluated. The concordance between physicians' and patients' answers, was 0.83 (95%-CI 0.71-0.91) in the intervention group, compared to 0.60 (95%-CI 0.48-0.70) in the control group, and the difference between the two groups was statistically significant (p = 0.005). CONCLUSION: This pilot study shows that disease-centred advance directives help physicians understand their NSCLC patients' wishes more precisely and make treatment choices according to these wishes. TRIAL REGISTRATION: The study is registered at the German Clinical Trial Register (no. DRKS00017580, registration date 27/08/2019)."
