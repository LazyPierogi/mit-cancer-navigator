                    - heading "Abstract" [level=4] [ref=e10741]
                    - paragraph [ref=e10742]: The reference to vitiligo-like lesions (VLLs) induced by immune checkpoint inhibitors (ICIs) as a valuable predictive marker of treatment success of immunotherapy with ICIs in melanoma has been mentioned in the literature. Its role in non-small cell lung cancer (NSCLC)-treated patients remains a poorly recognized phenomenon with uncertain significance regarding its predictive value. A retrospective, observational, single-center report was performed, with descriptive analysis of clinicopathological and treatment characteristics of patients with stage IV NSCLC who developed ICI-induced VLL between January 2018 and December 2022, contextualized in a comprehensive review of the literature and reported cases regarding this phenomenon. During the first 5 years' experience of ICI use in stage IV NSCLC treatment, three cases of ICI-induced VLLs were diagnosed. In line with the previous reports, two of the three presented cases exhibited treatment response and favorable prognosis. The recognition and understanding of the pathophysiological processes underlying ICI-induced VLLs may represent a promising opportunity to identify a predictive marker of tumor response to ICIs, with impact in treatment selection and patient management. It also may contribute to the recognition of new patterns of molecular expression that could lead to improvements in therapeutic development.
