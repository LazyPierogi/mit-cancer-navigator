                    - paragraph [ref=e7579]: "INTRODUCTION: Clinical evidence suggests that first-line immune checkpoint inhibitor (ICI) combination therapies can improve survival in patients with advanced non-squamous non-small cell lung cancer (nsq-NSCLC). However, the optimal strategy remains unknown without a systematic comparison of their long-term effects. METHODS: We performed a systematic review and network meta-analysis by retrieving up-to-date literature from PubMed(®) (National Library of Medicine, Bethesda, MD, USA), Embase(®) (Elsevier, Amsterdam, Netherlands), MEDLINE(®) (National Library of Medicine), ClinicalTrials.gov (National Library of Medicine), and major international conference publications. Published studies and abstracts comparing first-line ICI combination therapies with other treatments for patients with advanced nsq-NSCLC were included. Restricted mean survival time (RMST) was measured over 12 months for progression-free survival (PFS) and 18 months for overall survival (OS), and the Royston-Parmar model was used to extrapolate and compare data for the long-term outcomes. RESULTS: We included a total of 11 trials involving 12 therapies and 6,130 patients. Pembrolizumab plus chemotherapy exhibited the best overall survival (OS) benefit at both 18 and 60 months [RMST = 2.95, 95% confidence interval (CI) 1.96 to 3.97; life-years gained over a 5-year period = 2.18 years]. Nivolumab plus bevacizumab plus chemotherapy was found to present the best progression-free survival (PFS) benefit at 12 months (RMST 3.02, 95% CI 2.11 to 3.91), whereas atezolizumab plus bevacizumab plus chemotherapy showed the best PFS benefit at 36 months (life-years gained over 3 years = 1.22 years). Subgroup analyses showed that among patients with programmed death-ligand 1 (PD-L1) expression ≥ 50%, atezolizumab plus chemotherapy and nivolumab plus ipilimumab resulted in superior OS benefits at 18 and 60 months, respectively. Among patients with PD-L1 expression< 1%, pembrolizumab plus chemotherapy was associated with OS benefits at both 18 and 60 months. Sintilimab plus chemotherapy was associated with relatively fewer grade ≥ 3 adverse events than other ICI combination therapies. CONCLUSION: Our results show that ICI combination therapies showed better survival benefits than chemotherapy. Pembrolizumab plus chemotherapy could provide the best OS benefits to patients with advanced nsq-NSCLC, whereas atezolizumab plus bevacizumab plus chemotherapy could bring the best PFS benefits. The optimal ICI combination therapy varies depending on PD-L1 expression level. SYSTEMATIC REVIEW REGISTRATION: https://www.crd.york.ac.uk/PROSPERO/display_record.php?RecordID=325005, identifier CRD42022325005."
