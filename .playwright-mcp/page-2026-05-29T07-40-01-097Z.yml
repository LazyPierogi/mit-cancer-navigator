                    - heading "Abstract" [level=4] [ref=e10810]
                    - paragraph [ref=e10811]: "BACKGROUND: In the contemporary era of cancer treatment, lung cancer (LC) holds the unenviable position of being the primary contributor to cancer-induced mortality worldwide. Although immunotherapy has expanded the therapeutic landscape for metastatic non-small cell lung cancer (NSCLC), the advent of immune checkpoint inhibitors has been accompanied by a concomitant increase in immune-related adverse events (irAEs). Timely detection of irAEs is pivotal for efficacious management and enhanced patient outcomes. Diagnostic imaging, encompassing x-ray and CT scans, can facilitate the identification and supervision of irAEs, thereby ensuring the prompt recognition of associated patterns and alterations for expeditious treatment. METHODS: The present inquiry undertook a systematic exploration of multiple databases, incorporating a diverse array of studies such as randomized controlled trials and observational analyses. Patient demographics, imaging outcomes, and risk of bias were extracted from the data. Meta-analysis was executed utilizing R Statistical Software, with the results of the risk of bias assessment summarized accordingly. FINDINGS: The analysis unveiled a higher prevalence of irAEs in patients receiving first-line treatment for NSCLC compared to those receiving subsequent treatments, with a statistically significant distinction observed for both high- and low-grade irAEs (p < 0.001). Pneumonitis, thyroiditis, and colitis emerged as the most frequently reported irAEs, whereas hepatitis and pancolitis were less commonly documented. This investigation signifies a crucial advancement in elucidating the function of imaging in the treatment of NSCLC with PD-1/PD-L1 inhibitors and emphasizes the imperative for ongoing research in this domain."
