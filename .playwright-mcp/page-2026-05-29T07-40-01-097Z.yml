                  - generic [ref=e10533]:
                    - heading "Abstract" [level=4] [ref=e10534]
                    - paragraph [ref=e10535]: Non-small cell lung cancer (NSCLC), as the predominant histological subtype of lung cancer, accounts for approximately 85% of all lung cancer cases. In recent years, immune checkpoint inhibitors (ICIs), represented by programmed death 1/programmed death ligand 1 (PD-1/PD-L1) inhibitors, have achieved breakthrough advancements in patients with driver gene-negative NSCLC. They have been established as a key component of first-line treatment regimens and have significantly improved clinical outcomes. However, limited clinical evidence has emerged showing the phenomenon of histological transformation from NSCLC to small cell lung cancer (SCLC) in patients experiencing disease progression after ICIs monotherapy or combination therapy. Systematic research data on the clinical characteristics, molecular biological basis, and subsequent treatment strategies for such transformation events are currently lacking. This article reports a case of SCLC transformation occurring in a patient with KRAS-mutated lung adenocarcinoma after 16 months of ICIs combination therapy and provides a systematic review of 22 similar published cases. The study demonstrates that small cell transformation is a critical mechanism of immunotherapy resistance, and transformed patients exhibit poor prognosis. The research emphasizes the importance of dynamic monitoring of neuron-specific enolase (NSE) and standardized repeat biopsies during treatment, providing a basis for clinical practice. This aids in enhancing the recognition and management capabilities for this rare histological transformation, ultimately improving patient outcomes.
