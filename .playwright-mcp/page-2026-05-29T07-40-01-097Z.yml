                  - generic [ref=e10602]:
                    - heading "Abstract" [level=4] [ref=e10603]
                    - paragraph [ref=e10604]: "INTRODUCTION: The role of radical local therapy in oligometastatic non-small cell lung cancer (NSCLC) is rapidly evolving and has shown mixed results. We assessed the effect of add-on radical local therapy versus systemic therapy alone on overall survival (OS), progression-free survival (PFS) and safety in oligometastatic NSCLC. METHODS: In this systematic review and individual participant data (IPD) meta-analysis, we screened PubMed, Embase, Scopus and CENTRAL until 20 April 2025 for randomised controlled trials (RCTs) answering our research question. We retrieved IPD from survival curves of published reports and used one-stage IPD meta-analysis. We also estimated the more clinically intuitive restricted mean survival time difference (RMSTD). We assessed between-study heterogeneity using the median HR (MHR). We assessed risk of bias using the Risk of Bias 2 tool and rated the evidence certainty using the Grading of Recommendations, Assessment, Development and Evaluations framework. FINDINGS: We screened 1004 records to include ten RCTs (mostly at a low risk of bias) with 752 participants (338 males), predominantly using radiotherapy as radical local therapy. Add-on radical local therapy improved OS by 38% [HR: 0.62, 95% CI 0.50 to 0.76; high certainty of evidence]. Between-trial heterogeneity does not affect the results, only leading to 3% difference [MHR 1.03]. Add-on radical local therapy leads to longer OS by 0.47 month (0.21-0.72), 2.18 months (0.74-3.63), 4.20 months (1.95-6.45) and 6.65 months (4.05-9.24) over 1, 2, 3 and 4 years. Add-on radical local therapy possibly improved PFS by 40% (HR: 0.60, 95% CI 0.45 to 0.80; low certainty of evidence). Radical local therapy was well tolerated with no major safety concerns. INTERPRETATION: Add-on radical local therapy-chiefly radiotherapy-is beneficial in oligometastatic NSCLC. Inconsistent reporting of safety limited quantitative synthesis. Future studies may address the role of surgery as radical local therapy, and the role of programmed death ligand 1 expression. PROSPERO REGISTRATION NUMBER: CRD42024576829."
